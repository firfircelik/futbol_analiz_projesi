# Analysis Configuration
analysis:
  football:
    key_metrics:
      - "goals"
      - "assists"
      - "shots"
      - "shots_on_target"
      - "possession"
      - "passes"
      - "pass_accuracy"
      - "tackles"
      - "interceptions"
      - "clearances"
      - "fouls"
      - "corners"
      - "xG"  # Expected Goals
      - "xA"  # Expected Assists
      - "progressive_passes"
      - "dribbles"
      - "key_passes"

    advanced_metrics:
      - "xT"  # Expected Threat
      - "PPDA"  # Passes Allowed Per Defensive Action
      - "build_up_speed"
      - "defensive_line_height"
      - "pressing_intensity"
      - "progressive_distance"
      - "final_third_entries"
      - "shot_creating_actions"
      - "goal_creating_actions"
      - "opta_index"

  basketball:
    key_metrics:
      - "points"
      - "rebounds"
      - "assists"
      - "steals"
      - "blocks"
      - "turnovers"
      - "field_goal_pct"
      - "three_point_pct"
      - "free_throw_pct"
      - "plus_minus"
      - "minutes_played"

    advanced_metrics:
      - "PER"  # Player Efficiency Rating
      - "true_shooting_pct"
      - "effective_fg_pct"
      - "usage_rate"
      - "offensive_rating"
      - "defensive_rating"
      - "win_shares"
      - "box_plus_minus"
      - "value_over_replacement"
      - "opta_index"

# Report Configuration
reports:
