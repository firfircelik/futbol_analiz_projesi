# Analysis Configuration
analysis:
  football:
    key_metrics:
      - "goals"
      - "shots"
      - "shots_on_target"
      - "possession"
      - "passes"
      - "pass_accuracy"
      - "tackles"
      - "fouls"
      - "corners"
      - "xG"  # Expected Goals
      - "xA"  # Expected Assists
      - "progressive_passes"
      - "dribbles"

    advanced_metrics:
      - "xT"  # Expected Threat
      - "PPDA"  # Passes Allowed Per Defensive Action
      - "build_up_speed"
      - "defensive_line_height"
      - "pressing_intensity"

  basketball:
    key_metrics:
      - "points"
      - "rebounds"
      - "assists"
      - "steals"
      - "blocks"
      - "turnovers"
      - "field_goal_pct"
      - "three_point_pct"
      - "free_throw_pct"
      - "plus_minus"
      - "minutes_played"

    advanced_metrics:
      - "PER"  # Player Efficiency Rating
      - "true_shooting_pct"
      - "effective_fg_pct"
      - "usage_rate"
      - "offensive_rating"
      - "defensive_rating"
      - "win_shares"
      - "box_plus_minus"

# Report Configuration
reports:
  types:
    - "league_overview"
    - "team_analysis"
    - "player_scouting"
    - "tactical_breakdown"
    - "predictive_insights"
    - "season_summary"

  export_formats:
    - "pdf"
    - "html"
    - "json"
    - "excel"

  visualizations:
    - "heatmaps"
    - "radar_charts"
    - "trend_lines"
    - "shot_charts"
    - "pass_networks"
    - "comparison_charts"
